<script>
const CLIENT_ID =
"127555248023-80bisfnfcjj0dsh61fjn0ofa3lj8mli1.apps.googleusercontent.com";

const SCRIPT_ID =
"AKfycbxaB2LDck7cQBhwVrevU3_3NbiIlCck9qieD-26Z6jlzcDC0nQJ8SviTh5TPaxd_Ci05A";

const SCOPES =
"https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/spreadsheets";

const DEFAULT_TYPES = [
"Kombineeritud mänguvahend","Kiik","Liumägi","Ronimisvahend",
"Vedrukiik","Karussell","Tasakaaluvahend","Liivakast"
];

let db;
let objektid=[];
let currentObject=null;
let currentElements=[];
let currentPhotoElement=null;
let accessToken=null;
let tokenClient=null;
let gisReady=false;
let syncing=false;

const $=id=>document.getElementById(id);

/* ================= DATABASE ================= */

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open("PlaysafePWA",2);

  r.onupgradeneeded=e=>{
   const d=e.target.result;

   if(!d.objectStoreNames.contains("objects"))
    d.createObjectStore("objects",{keyPath:"nr"});

   if(!d.objectStoreNames.contains("meta"))
    d.createObjectStore("meta",{keyPath:"key"});

   if(!d.objectStoreNames.contains("elements"))
    d.createObjectStore("elements",{keyPath:"localId"});

   if(!d.objectStoreNames.contains("photos"))
    d.createObjectStore("photos",{keyPath:"id",autoIncrement:true});

   if(!d.objectStoreNames.contains("types"))
    d.createObjectStore("types",{keyPath:"name"});
  };

  r.onsuccess=()=>{db=r.result;resolve()};
  r.onerror=()=>reject(r.error);
 });
}

function getAll(store){
 return new Promise((resolve,reject)=>{
  const r=db.transaction(store,"readonly").objectStore(store).getAll();
  r.onsuccess=()=>resolve(r.result||[]);
  r.onerror=()=>reject(r.error);
 });
}

function put(store,value){
 return new Promise((resolve,reject)=>{
  const r=db.transaction(store,"readwrite").objectStore(store).put(value);
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

function add(store,value){
 return new Promise((resolve,reject)=>{
  const r=db.transaction(store,"readwrite").objectStore(store).add(value);
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

function del(store,key){
 return new Promise((resolve,reject)=>{
  const r=db.transaction(store,"readwrite").objectStore(store).delete(key);
  r.onsuccess=()=>resolve();
  r.onerror=()=>reject(r.error);
 });
}

function clearStore(store){
 return new Promise((resolve,reject)=>{
  const r=db.transaction(store,"readwrite").objectStore(store).clear();
  r.onsuccess=()=>resolve();
  r.onerror=()=>reject(r.error);
 });
}

async function replaceObjects(items){
 await clearStore("objects");
 for(const o of items) if(o.nr!==""&&o.nr!=null) await put("objects",o);
}

async function setMeta(key,value){await put("meta",{key,value})}

async function getMeta(key){
 const all=await getAll("meta");
 const x=all.find(v=>v.key===key);
 return x?x.value:null;
}

/* ================= GOOGLE ================= */

function initGoogle(){
 if(!window.google?.accounts?.oauth2)return false;

 tokenClient=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,
  scope:SCOPES,
  callback:()=>{}
 });

 gisReady=true;
 return true;
}

function waitGoogle(){
 return new Promise(resolve=>{
  let n=0;
  const t=setInterval(()=>{
   n++;
   if(initGoogle()){clearInterval(t);resolve(true)}
   else if(n>=40){clearInterval(t);resolve(false)}
  },200);
 });
}

function getToken(){
 return new Promise((resolve,reject)=>{
  if(!navigator.onLine)return reject(new Error("Internetiühendus puudub."));
  if(!gisReady)return reject(new Error("Google'i teenus pole valmis."));

  tokenClient.callback=r=>{
   if(r.error)return reject(new Error(r.error_description||r.error));
   accessToken=r.access_token;
   $("authBox").style.display="none";
   resolve(accessToken);
  };

  tokenClient.requestAccessToken({prompt:accessToken?"":"consent"});
 });
}

async function runScript(fn,parameters=[]){
 if(!accessToken)throw new Error("Google'i autoriseerimine on vajalik.");

 const res=await fetch(
  `https://script.googleapis.com/v1/scripts/${encodeURIComponent(SCRIPT_ID)}:run`,
  {
   method:"POST",
   headers:{
    Authorization:`Bearer ${accessToken}`,
    "Content-Type":"application/json"
   },
   body:JSON.stringify({function:fn,parameters})
  }
 );

 const data=await res.json();

 if(res.status===401){
  accessToken=null;
  throw new Error("Google'i sisselogimine aegus.");
 }

 if(!res.ok)throw new Error(data?.error?.message||`Google API viga ${res.status}`);

 if(data.error){
  const detail=data.error.details?.[0];
  throw new Error(detail?.errorMessage||"Apps Scripti viga.");
 }

 return data.response?.result;
}

/* ================= OBJECTS ================= */

async function syncObjects(){
 const result=await runScript("getObjektid");
 if(!Array.isArray(result))throw new Error("Objektide nimekirja ei saadud.");

 await replaceObjects(result);
 objektid=result;
 await setMeta("lastSync",new Date().toISOString());

 try{
  const types=await runScript("getElemendiTyypid");
  if(Array.isArray(types)){
   for(const name of types)await put("types",{name});
  }
 }catch(e){console.warn(e)}

 renderObjects();
 await updateSyncInfo();
}

function objectName(o){return o.objekt||o.nimi||"Nimetu objekt"}
function esc(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
 .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function renderObjects(){
 const q=$("searchInput").value.trim().toLowerCase();
 const list=objektid.filter(o=>
  [o.nr,o.objekt,o.aadress,o.tellija].join(" ").toLowerCase().includes(q)
 );

 $("objectList").innerHTML="";

 if(!list.length){
  $("objectList").innerHTML='<div class="empty">Objekte ei leitud.</div>';
  return;
 }

 list.forEach(o=>{
  const d=document.createElement("div");
  d.className="card objectCard";
  d.innerHTML=`<div class="small">NR ${esc(o.nr)}</div>
  <div class="objectName">${esc(objectName(o))}</div>
  <div class="muted">${esc(o.aadress||"")}</div>`;
  d.onclick=()=>showObject(o);
  $("objectList").appendChild(d);
 });
}

function detailRow(label,value){
 if(value==null||value==="")return "";
 return `<div class="row"><div class="label">${esc(label)}</div>
 <div class="value">${esc(value)}</div></div>`;
}

function showObject(o){
 currentObject=o;
 $("listView").style.display="none";
 $("workView").style.display="none";
 $("detailView").style.display="block";
 $("pageTitle").textContent="Objekt";

 $("detailView").innerHTML=`
 <button class="back" id="detailBack">‹ Tagasi objektidesse</button>
 <div class="card">
  <div class="detailTitle">${esc(objectName(o))}</div>
  ${detailRow("Jrk nr",o.nr)}
  ${detailRow("Aadress",o.aadress)}
  ${detailRow("Väljaku tüüp",o.valjakuTyyp)}
  ${detailRow("Hindamise liik",o.hindamiseLiik)}
  ${detailRow("Tellija",o.tellija)}
  ${detailRow("Staatus",o.staatus)}
  ${detailRow("Aruande nr",o.aruandeNr)}
  <button id="startWork" class="btn btnDark btnFull">Alusta pildistamist</button>
 </div>`;

 $("detailBack").onclick=showList;
 $("startWork").onclick=()=>openWork(o);
}

function showList(){
 $("detailView").style.display="none";
 $("workView").style.display="none";
 $("listView").style.display="block";
 $("pageTitle").textContent="Objektid";
}

/* ================= ELEMENTS ================= */

async function localElementsFor(nr){
 const all=await getAll("elements");
 return all.filter(e=>String(e.objectNr)===String(nr));
}

async function pendingPhotosFor(nr){
 const all=await getAll("photos");
 return all.filter(p=>String(p.objectNr)===String(nr));
}

async function loadServerElements(nr){
 if(!navigator.onLine||!accessToken)return;

 const server=await runScript("getElemendid",[nr]);
 if(!Array.isArray(server))return;

 const local=await localElementsFor(nr);
 const pendingPhotos=await pendingPhotosFor(nr);
 const serverIds=new Set(server.map(s=>String(s.id)));

 // Kui serveris varem olnud element on Drive'ist kadunud:
 // - ootel fotodega element tehakse uuesti sünkroniseeritavaks;
 // - ilma ootel tööta element eemaldatakse telefoni cache'ist.
 for(const e of local){
  if(!e.serverId)continue;

  if(e.pendingDelete){
   if(!serverIds.has(String(e.serverId))){
    await del("elements",e.localId);
   }
   continue;
  }

  if(serverIds.has(String(e.serverId)))continue;

  const hasPending=pendingPhotos.some(
   p=>p.localElementId===e.localId
  );

  if(hasPending){
   e.serverId=null;
   e.synced=false;
   e.serverPhotoCount=0;
   e.serverMissing=true;
   await put("elements",e);

   for(const p of pendingPhotos){
    if(p.localElementId===e.localId){
     p.serverElementId=null;
     await put("photos",p);
    }
   }
  }else{
   await del("elements",e.localId);
  }
 }

 const refreshedLocal=await localElementsFor(nr);

 for(const s of server){
  const existing=refreshedLocal.find(
   e=>String(e.serverId)===String(s.id)
  );

  if(existing){
   existing.jarjekord=s.jarjekord;
   if(!existing.pendingRename)existing.tyyp=s.tyyp;
   existing.serverPhotoCount=s.fotodeArv||0;
   existing.synced=true;
   existing.serverMissing=false;
   await put("elements",existing);
  }else{
   await put("elements",{
    localId:`server-${s.id}`,
    objectNr:nr,
    serverId:s.id,
    jarjekord:s.jarjekord,
    tyyp:s.tyyp,
    serverPhotoCount:s.fotodeArv||0,
    synced:true,
    serverMissing:false
   });
  }
 }
}

async function openWork(o){
 currentObject=o;
 $("detailView").style.display="none";
 $("listView").style.display="none";
 $("workView").style.display="block";
 $("pageTitle").textContent="Hindamine";

 if(navigator.onLine&&accessToken){
  try{await loadServerElements(o.nr)}catch(e){console.warn(e)}
 }

 await renderWork();
}

async function renderWork(){
 currentElements=(await localElementsFor(currentObject.nr))
  .filter(e=>!e.pendingDelete)
  .sort((a,b)=>Number(a.jarjekord)-Number(b.jarjekord));

 const photos=await pendingPhotosFor(currentObject.nr);

 let photoTotal=photos.length;
 for(const e of currentElements)photoTotal+=Number(e.serverPhotoCount||0);

 const pendingElements=currentElements.filter(e=>!e.serverId).length;
 const pendingCount=pendingElements+photos.length;

 $("workView").innerHTML=`
 <button class="back" id="workBack">‹ Tagasi objekti juurde</button>
 <div class="workTitle">${esc(objectName(currentObject))}</div>
 <div class="workAddress">${esc(currentObject.aadress||"")}</div>

 <div class="summary">
  <div class="summaryBox"><div class="summaryNumber">${currentElements.length}</div><div class="summaryLabel">ELEMENTE</div></div>
  <div class="summaryBox"><div class="summaryNumber">${photoTotal}</div><div class="summaryLabel">FOTOSID</div></div>
  <div class="summaryBox"><div class="summaryNumber">${pendingCount}</div><div class="summaryLabel">OOTEL</div></div>
 </div>

 <button id="newElement" class="btn btnDark btnFull addElement">+ Lisa element</button>
 <div id="elementsHere" class="elementList"></div>`;

 $("workBack").onclick=()=>showObject(currentObject);
 $("newElement").onclick=openElementModal;

 const container=$("elementsHere");

 if(!currentElements.length){
  container.innerHTML='<div class="empty">Lisa esimene mänguväljaku element.</div>';
  return;
 }

 for(const e of currentElements){
  const ownPending=photos.filter(p=>p.localElementId===e.localId).length;
  const total=Number(e.serverPhotoCount||0)+ownPending;

  const d=document.createElement("div");
  d.className="elementCard";
  d.innerHTML=`
   <div class="elementTop">
    <div>
     <div class="elementNumber">ELEMENT ${String(e.jarjekord).padStart(2,"0")}</div>
     <div class="elementType">${esc(e.tyyp)}</div>
     <div class="photoCount">${total} fotot</div>
     ${(!e.serverId||ownPending)?`<div class="pending">↑ Ootel ${(!e.serverId?1:0)+ownPending}</div>`:""}
    </div>
   </div>
   <button class="btn photoButton">📷 Lisa fotod</button>
   <div class="elementActions">
    <button class="btn elementAction editElement">✏️ Muuda</button>
    <button class="btn elementAction deleteAction deleteElement">🗑 Kustuta</button>
   </div>`;

  d.querySelector(".photoButton").onclick=()=>openPhotoModal(e);
  d.querySelector(".editElement").onclick=()=>editElement(e);
  d.querySelector(".deleteElement").onclick=()=>deleteElement(e);
  container.appendChild(d);
 }
}

async function editElement(element){
 const uusTyyp=prompt(
  "Elemendi uus nimi / tüüp:",
  element.tyyp||""
 );

 if(uusTyyp===null)return;

 const clean=String(uusTyyp).trim();
 if(!clean)return;

 element.tyyp=clean;
 await put("types",{name:clean});

 if(element.serverId&&navigator.onLine){
  try{
   syncStage="Google autoriseerimine";
  await ensureToken();

   const result=await runScript("muudaElement",[
    element.serverId,
    clean
   ]);

   if(result){
    element.tyyp=result.tyyp||clean;
    element.jarjekord=result.jarjekord||element.jarjekord;
    element.serverPhotoCount=Number(
     result.fotodeArv??element.serverPhotoCount??0
    );
    element.synced=true;
    element.pendingRename=false;
   }
  }catch(e){
   console.warn(e);
   element.pendingRename=true;
  }
 }else{
  element.pendingRename=!!element.serverId;
 }

 await put("elements",element);
 await renderWork();

 if(element.pendingRename){
  toast("Nime muutmine salvestatud telefoni");
  if(navigator.onLine)syncPending();
 }else{
  toast("Elemendi nimi muudetud");
 }
}


async function deleteElement(element){
 const label=
  `${String(element.jarjekord).padStart(2,"0")} – ${element.tyyp}`;

 if(!confirm(
  `Kas soovid kustutada elemendi ${label}?\n\n`+
  "Kustutatakse ka kõik selle elemendi fotod."
 ))return;

 const allPhotos=await getAll("photos");
 const ownPhotos=allPhotos.filter(
  p=>p.localElementId===element.localId
 );

 // Ainult telefonis olev element saab kohe kaduda.
 if(!element.serverId){
  for(const p of ownPhotos)await del("photos",p.id);
  await del("elements",element.localId);
  await renderWork();
  toast("Element kustutatud");
  return;
 }

 // Serveris olev element: märgime kustutamise ootele.
 // Ootel fotod eemaldatakse, sest kasutaja kinnitas kogu elemendi kustutamise.
 for(const p of ownPhotos)await del("photos",p.id);

 element.pendingDelete=true;
 await put("elements",element);
 await renderWork();

 if(navigator.onLine){
  await syncPending();
 }else{
  toast("Kustutamine salvestatud telefoni");
 }
}


async function getTypes(){
 let types=(await getAll("types")).map(x=>x.name);

 if(!types.length){
  for(const name of DEFAULT_TYPES)await put("types",{name});
  types=[...DEFAULT_TYPES];
 }

 return types.sort((a,b)=>a.localeCompare(b,"et"));
}

async function openElementModal(){
 const types=await getTypes();
 $("typeList").innerHTML="";

 types.forEach(type=>{
  const b=document.createElement("button");
  b.className="typeButton";
  b.textContent=type;
  b.onclick=()=>createLocalElement(type);
  $("typeList").appendChild(b);
 });

 $("customType").value="";
 $("elementModal").style.display="flex";
}

async function createLocalElement(type){
 type=String(type||"").trim();
 if(!type)return;

 const existing=await localElementsFor(currentObject.nr);
 const max=existing.length?Math.max(...existing.map(e=>Number(e.jarjekord)||0)):0;

 const element={
  localId:`local-${Date.now()}-${Math.random().toString(36).slice(2)}`,
  objectNr:currentObject.nr,
  serverId:null,
  jarjekord:max+1,
  tyyp:type,
  serverPhotoCount:0,
  synced:false,
  createdAt:new Date().toISOString()
 };

 await put("elements",element);
 await put("types",{name:type});

 $("elementModal").style.display="none";
 await renderWork();
 toast("Element lisatud");

 if(navigator.onLine)syncPending();
}

$("addCustomType").onclick=()=>createLocalElement($("customType").value);
$("cancelElement").onclick=()=>{$("elementModal").style.display="none"};

async function saveFiles(fileList){
 if(!currentPhotoElement||!fileList?.length)return;

 let count=0;

 for(const file of Array.from(fileList)){
  if(!file.type.startsWith("image/"))continue;

  const uploadId =
   (crypto.randomUUID)
    ? crypto.randomUUID()
    : "photo-" + Date.now() + "-" + Math.random().toString(36).slice(2);

  const photoBytes=await file.arrayBuffer();

  await add("photos",{
   objectNr:currentObject.nr,
   localElementId:currentPhotoElement.localId,
   serverElementId:currentPhotoElement.serverId||null,
   uploadId:uploadId,
   bytes:photoBytes,
   mimeType:file.type||"image/jpeg",
   originalName:file.name||"foto.jpg",
   createdAt:new Date().toISOString()
  });

  count++;
 }

 await renderWork();
 toast(`${count} fotot salvestatud telefoni`);

 if(navigator.onLine)syncPending();
}

/* ================= OFFLINE SYNC ================= */

function blobToBase64(blob){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const value=String(reader.result||"");
   resolve(value.includes(",")?value.split(",").pop():value);
  };
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(blob);
 });
}

function arrayBufferToBase64(buffer){
 const bytes=new Uint8Array(buffer);
 const chunkSize=0x8000;
 let binary="";
 for(let i=0;i<bytes.length;i+=chunkSize){
  binary+=String.fromCharCode.apply(
   null,
   bytes.subarray(i,Math.min(i+chunkSize,bytes.length))
  );
 }
 return btoa(binary);
}

async function photoToBase64(p){
 // Uus iOS-kindlam formaat: foto binaarandmed on IndexedDB-s ArrayBufferina.
 if(p.bytes){
  let buffer=p.bytes;

  if(ArrayBuffer.isView(buffer)){
   buffer=buffer.buffer.slice(
    buffer.byteOffset,
    buffer.byteOffset+buffer.byteLength
   );
  }

  if(buffer instanceof ArrayBuffer){
   return arrayBufferToBase64(buffer);
  }
 }

 // Fallback juba varem salvestatud Blob-fotode jaoks.
 if(p.blob){
  try{
   return await blobToBase64(p.blob);
  }catch(e){
   throw new Error(
    "Vana Blob-fotot ei saa iOS-is enam lugeda: "+
    (e?.message||String(e))
   );
  }
 }

 throw new Error("Foto binaarandmeid ei leitud.");
}

async function ensureToken(){
 if(accessToken)return;
 await getToken();
}

async function syncPending(){
 if(syncing||!navigator.onLine)return;

 syncing=true;
 updateConnection();

 const errors=[];
 let syncStage="algus";

 try{
  await ensureToken();

  // Reconciliation objektide kaupa. Ühe objekti viga ei peata teisi.
  syncStage="IndexedDB: elementide lugemine enne reconciliation'it";
  const allElementsBefore=await getAll("elements");
  syncStage="IndexedDB: fotode lugemine enne reconciliation'it";
  const allPhotosBefore=await getAll("photos");
  const affectedObjectNrs=new Set();

  for(const e of allElementsBefore){
   if(!e.serverId||e.pendingRename||e.pendingDelete){
    affectedObjectNrs.add(String(e.objectNr));
   }
  }

  for(const p of allPhotosBefore){
   affectedObjectNrs.add(String(p.objectNr));
  }

  syncStage="objektide reconciliation";
  for(const nr of affectedObjectNrs){
   try{
    await loadServerElements(nr);
   }catch(e){
    console.error("Reconciliation viga objektil",nr,e);
    errors.push(`Objekt ${nr}: ${e.message}`);
   }
  }


  // Ootel kustutamised.
  syncStage="IndexedDB: kustutamiste lugemine";
  const deletes=(await getAll("elements"))
   .filter(e=>e.serverId&&e.pendingDelete);

  for(const e of deletes){
   try{
    await runScript("kustutaElement",[e.serverId]);

    const queued=await getAll("photos");
    for(const p of queued){
     if(p.localElementId===e.localId)await del("photos",p.id);
    }

    await del("elements",e.localId);
   }catch(err){
    console.error("Elemendi kustutamise viga",e,err);
    errors.push(
     `Objekt ${e.objectNr}, element ${e.jarjekord}: ${err.message}`
    );
   }
  }


  // Ootel ümbernimetamised.
  syncStage="IndexedDB: ümbernimetamiste lugemine";
  const renames=(await getAll("elements"))
   .filter(e=>e.serverId&&e.pendingRename&&!e.pendingDelete);

  for(const e of renames){
   try{
    const result=await runScript("muudaElement",[
     e.serverId,
     e.tyyp
    ]);

    if(result){
     e.tyyp=result.tyyp||e.tyyp;
     e.jarjekord=result.jarjekord||e.jarjekord;
     e.serverPhotoCount=Number(
      result.fotodeArv??e.serverPhotoCount??0
     );
    }

    e.pendingRename=false;
    e.synced=true;
    await put("elements",e);
   }catch(err){
    console.error("Elemendi muutmise viga",e,err);
    errors.push(
     `Objekt ${e.objectNr}, element ${e.jarjekord}: ${err.message}`
    );
   }
  }


  // Lokaalsete elementide loomine.
  syncStage="IndexedDB: uute elementide lugemine";
  const elements=(await getAll("elements"))
   .filter(e=>!e.serverId&&!e.pendingDelete)
   .sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));

  for(const e of elements){
   try{
    const server=await runScript("lisaElement",[
     e.objectNr,e.tyyp,e.jarjekord
    ]);

    if(!server?.id){
     throw new Error("Elemendi loomine Drive'is ebaõnnestus.");
    }

    e.serverId=server.id;
    e.jarjekord=server.jarjekord;
    e.tyyp=server.tyyp;
    e.synced=true;
    e.serverMissing=false;
    await put("elements",e);

    const queued=await getAll("photos");
    for(const p of queued){
     if(p.localElementId===e.localId){
      p.serverElementId=e.serverId;
      await put("photos",p);
     }
    }
   }catch(err){
    console.error("Elemendi loomise viga",e,err);
    errors.push(
     `Objekt ${e.objectNr}, element ${e.jarjekord}: ${err.message}`
    );
   }
  }


  // Fotod: iga foto eraldi try/catch.
  // Üks vigane vana foto ei peata järgmiste objektide fotosid.
  syncStage="IndexedDB: fotode järjekorra lugemine";
  const photos=(await getAll("photos"))
   .sort((a,b)=>Number(a.id)-Number(b.id));

  for(const p of photos){
   let photoStage=`foto ${p.id}: algus`;

   try{
    photoStage=`foto ${p.id}: IndexedDB elements getAll`;
    const els=await getAll("elements");

    photoStage=`foto ${p.id}: elemendi otsimine localId=${p.localElementId}`;
    const el=els.find(e=>e.localId===p.localElementId);

    if(!el){
     throw new Error(
      `Foto elemendi kirjet ei leitud telefonist (localElementId=${p.localElementId}).`
     );
    }

    if(el.pendingDelete){
     console.warn("Foto jäeti vahele: element on kustutamisel",p,el);
     continue;
    }

    const folderId=el.serverId;

    if(!folderId){
     throw new Error(
      `Elemendi Drive'i kaust pole veel loodud (localElementId=${p.localElementId}).`
     );
    }

    if(p.serverElementId!==folderId){
     photoStage=`foto ${p.id}: IndexedDB photo put / serverElementId uuendus`;
     p.serverElementId=folderId;
     await put("photos",p);
    }

    if(!p.uploadId){
     photoStage=`foto ${p.id}: IndexedDB photo put / uploadId loomine`;
     p.uploadId="legacy-"+p.id;
     await put("photos",p);
    }

    photoStage=`foto ${p.id}: fotoandmed -> base64`;
    const base64=await photoToBase64(p);

    photoStage=`foto ${p.id}: Apps Script lisaFoto / kaust ${folderId}`;
    const result=await runScript("lisaFoto",[
     folderId,
     base64,
     p.mimeType,
     p.originalName,
     p.uploadId
    ]);

    if(!result){
     throw new Error("Foto üleslaadimine ei tagastanud tulemust.");
    }

    photoStage=`foto ${p.id}: IndexedDB element put pärast uploadi`;
    el.serverPhotoCount=Number(
     result.fotodeArv||((el.serverPhotoCount||0)+1)
    );
    await put("elements",el);

    photoStage=`foto ${p.id}: IndexedDB photo delete pärast uploadi`;
    await del("photos",p.id);

    console.log(
     "FOTO SYNC OK",
     {photoId:p.id,objectNr:p.objectNr,localElementId:p.localElementId,
      folderId:folderId,uploadId:p.uploadId}
    );

   }catch(err){
    const detail=
     `Objekt ${p.objectNr}, foto ${p.id}, etapp "${photoStage}": ${err.message}`;

    console.error("FOTO SYNC VIGA",{
     detail,
     photo:p,
     error:err
    });

    errors.push(detail);
    // Jätkame järgmise fotoga.
   }
  }


  // Lõpuks värskendame aktiivset objekti, kuid ka selle viga
  // ei muuda juba õnnestunud üleslaadimisi ebaõnnestunuks.
  if(currentObject){
   try{
    await loadServerElements(currentObject.nr);
   }catch(e){
    console.error("Aktiivse objekti värskendamise viga",e);
    errors.push(`Objekt ${currentObject.nr}: ${e.message}`);
   }

   if($("workView").style.display!=="none"){
    await renderWork();
   }
  }


  if(errors.length){
   const unique=[...new Set(errors)];
   showError(
    `Sünkroniseerimine lõpetatud: ${unique.length} viga jäi ootele. `+
    unique.slice(0,3).join(" | ")
   );
   toast("Osa töid sünkroniseeriti, osa jäi ootele");
  }else{
   hideError();
   toast("Ootel tööd sünkroniseeritud");
  }

 }catch(e){
  console.error(e);

  if(String(e.message).includes("aegus")){
   accessToken=null;
  }

  showError(
   `Sünkroniseerimise viga etapis "${syncStage}": ${e.message}`
  );
 }
 finally{
  syncing=false;
  updateConnection();
 }
}


/* ================= MAIN SYNC ================= */

async function synchronize(){
 if(!navigator.onLine){
  toast("Offline — töö on telefonis");
  return;
 }

 hideError();
 $("syncButton").disabled=true;
 $("syncButton").textContent="Sünkroniseerin...";

 try{
  await ensureToken();
  await syncObjects();
  await syncPending();
  $("authBox").style.display="none";
  toast("Sünkroniseeritud");
 }
 catch(e){
  console.error(e);
  showError("Sünkroniseerimise viga: "+e.message);
  if(!accessToken)$("authBox").style.display="block";
 }
 finally{
  $("syncButton").disabled=false;
  $("syncButton").textContent="↻ Sünkroniseeri";
  updateConnection();
 }
}

/* ================= UI ================= */

function updateConnection(){
 if(syncing){
  $("connectionStatus").textContent="↑ Sünkroniseerin Drive'i...";
  $("connectionStatus").className="connection online";
 }else if(navigator.onLine){
  $("connectionStatus").textContent="✓ Ühendus olemas";
  $("connectionStatus").className="connection online";
 }else{
  $("connectionStatus").textContent="● Offline — töö salvestatakse telefoni";
  $("connectionStatus").className="connection offline";
 }
}

async function updateSyncInfo(){
 const last=await getMeta("lastSync");
 $("syncInfo").textContent=last
 ? `Telefonis ${objektid.length} objekti • viimati sünkroniseeritud ${new Date(last).toLocaleString("et-EE")}`
 : "Seda telefoni pole veel registriga sünkroniseeritud.";
}

function showError(message){
 $("errorBox").textContent=message;
 $("errorBox").style.display="block";
}

function hideError(){
 $("errorBox").style.display="none";
}

function toast(message){
 const t=$("toast");
 t.textContent=message;
 t.style.display="block";
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>t.style.display="none",3000);
}

$("searchInput").oninput=renderObjects;
$("syncButton").onclick=synchronize;

$("googleButton").onclick=async()=>{
 try{
  hideError();
  await getToken();
  await synchronize();
 }catch(e){
  showError("Google'i ühenduse viga: "+e.message);
 }
};

window.addEventListener("online",()=>{
 updateConnection();
 toast("Internetiühendus taastatud");
});

window.addEventListener("offline",()=>{
 updateConnection();
 toast("Offline — töö jääb telefoni");
});

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js")
   .then(r=>r.update())
   .catch(console.error);
 });
}

/* ================= START ================= */

async function start(){
 try{
  await openDB();

  objektid=await getAll("objects");

  for(const name of DEFAULT_TYPES){
   const existing=(await getAll("types")).some(x=>x.name===name);
   if(!existing)await put("types",{name});
  }

  renderObjects();
  await updateSyncInfo();
  updateConnection();

  const ready=await waitGoogle();

  if(navigator.onLine){
   if(ready){
    $("authBox").style.display="block";
   }else{
    showError("Google'i sisselogimisteenust ei õnnestunud laadida.");
   }
  }
 }
 catch(e){
  showError("Rakenduse käivitamise viga: "+e.message);
 }
}

start();
