<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f5f5f7"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Playsafe"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>Playsafe</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    .header {
      background: white;
      padding:
        calc(40px + env(safe-area-inset-top))
        20px
        20px;
      border-bottom: 1px solid #dddddf;
    }

    .brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #77777b;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.1;
      margin: 0;
      font-weight: 800;
    }

    .content {
      padding: 18px;
      padding-bottom:
        calc(30px + env(safe-area-inset-bottom));
      max-width: 800px;
      margin: 0 auto;
    }

    .search {
      width: 100%;
      border: 1px solid #d8d8dc;
      border-radius: 16px;
      background: white;
      padding: 17px 16px;
      font-size: 18px;
      outline: none;
      margin-bottom: 14px;
    }

    .search:focus {
      border-color: #99999f;
    }

    .connection-card {
      background: white;
      border-radius: 16px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .connection {
      font-weight: 700;
      font-size: 17px;
    }

    .connection.online {
      color: #21833d;
    }

    .connection.offline {
      color: #b55a00;
    }

    .sync-button {
      border: 0;
      border-radius: 12px;
      background: #e8e8ec;
      color: #1d1d1f;
      padding: 12px 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .sync-button:disabled {
      opacity: 0.55;
    }

    .sync-info {
      color: #8b8b8f;
      font-size: 14px;
      margin: 10px 3px 14px;
    }

    .auth-box {
      background: #fff8e6;
      border: 1px solid #f0d590;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 14px;
      display: none;
    }

    .auth-title {
      font-weight: 750;
      margin-bottom: 6px;
    }

    .auth-text {
      font-size: 14px;
      line-height: 1.4;
      color: #6c6042;
      margin-bottom: 12px;
    }

    .google-button {
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      background: #1d1d1f;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .error-box {
      display: none;
      background: #fff0ee;
      color: #9d251d;
      border: 1px solid #ffc4bd;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 14px;
      font-size: 15px;
      line-height: 1.4;
    }

    .empty {
      background: white;
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
      color: #77777b;
      font-size: 18px;
    }

    .object-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .object-card {
      background: white;
      border-radius: 17px;
      padding: 16px;
      cursor: pointer;
      box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.03);
    }

    .object-number {
      font-size: 12px;
      color: #8a8a8f;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .object-name {
      font-size: 19px;
      font-weight: 750;
      line-height: 1.2;
      margin-bottom: 5px;
    }

    .object-address {
      color: #747478;
      font-size: 14px;
      line-height: 1.35;
    }

    .back-button {
      border: 0;
      background: transparent;
      padding: 0;
      margin-bottom: 14px;
      font-size: 16px;
      color: #55555a;
      cursor: pointer;
    }

    .detail-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
    }

    .detail-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .detail-row {
      border-top: 1px solid #eeeeef;
      padding: 11px 0;
    }

    .detail-label {
      color: #8a8a8f;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .detail-value {
      font-size: 16px;
      font-weight: 600;
      word-break: break-word;
    }

    .start-button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      background: #1d1d1f;
      color: white;
      font-size: 17px;
      font-weight: 750;
      padding: 16px;
      margin-top: 18px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom:
        calc(25px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: #1d1d1f;
      color: white;
      padding: 13px 20px;
      border-radius: 13px;
      max-width: 85%;
      text-align: center;
      display: none;
      z-index: 999;
      font-size: 15px;
    }

  </style>

  <!-- Google Identity Services -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>

</head>

<body>

  <div class="header">

    <div class="brand">
      PLAYSAFE
    </div>

    <h1 id="pageTitle">
      Objektid
    </h1>

  </div>


  <main
    class="content"
    id="mainContent"
  >

    <div id="listView">

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Otsi objekti või aadressi..."
        autocomplete="off"
      >


      <div class="connection-card">

        <div
          id="connectionStatus"
          class="connection"
        >
          Kontrollin ühendust...
        </div>

        <button
          id="syncButton"
          class="sync-button"
          type="button"
        >
          ↻ Sünkroniseeri
        </button>

      </div>


      <div
        id="syncInfo"
        class="sync-info"
      >
        Laen telefoni salvestatud registrit...
      </div>


      <div
        id="authBox"
        class="auth-box"
      >

        <div class="auth-title">
          Google'i ühendus vajalik
        </div>

        <div class="auth-text">
          Registri sünkroniseerimiseks logi sisse
          Playsafe'i Google'i kontoga.
          Offline töötamiseks pole sisselogimist vaja.
        </div>

        <button
          id="googleButton"
          class="google-button"
          type="button"
        >
          Ühenda Google
        </button>

      </div>


      <div
        id="errorBox"
        class="error-box"
      ></div>


      <div
        id="objectList"
        class="object-list"
      ></div>

    </div>


    <div
      id="detailView"
      style="display:none"
    ></div>

  </main>


  <div
    id="toast"
    class="toast"
  ></div>


<script>

  // =====================================================
  // PLAYSAFE GOOGLE SEADISTUS
  // =====================================================

  const CLIENT_ID =
    "127555248023-80bisfnfcjj0dsh61fjn0ofa3lj8mli1.apps.googleusercontent.com";

  const SCRIPT_ID =
    "AKfycbxaB2LDck7cQBhwVrevU3_3NbiIlCck9qieD-26Z6jlzcDC0nQJ8SviTh5TPaxd_Ci05A";

  const SCOPES =
    "https://www.googleapis.com/auth/drive " +
    "https://www.googleapis.com/auth/spreadsheets";


  // =====================================================
  // MUUTUJAD
  // =====================================================

  let db = null;

  let objektid = [];

  let tokenClient = null;

  let accessToken = null;

  let gisReady = false;

  let syncInProgress = false;


  // =====================================================
  // DOM
  // =====================================================

  const objectList =
    document.getElementById(
      "objectList"
    );

  const searchInput =
    document.getElementById(
      "searchInput"
    );

  const connectionStatus =
    document.getElementById(
      "connectionStatus"
    );

  const syncButton =
    document.getElementById(
      "syncButton"
    );

  const syncInfo =
    document.getElementById(
      "syncInfo"
    );

  const authBox =
    document.getElementById(
      "authBox"
    );

  const googleButton =
    document.getElementById(
      "googleButton"
    );

  const errorBox =
    document.getElementById(
      "errorBox"
    );

  const listView =
    document.getElementById(
      "listView"
    );

  const detailView =
    document.getElementById(
      "detailView"
    );

  const pageTitle =
    document.getElementById(
      "pageTitle"
    );


  // =====================================================
  // INDEXEDDB
  // =====================================================

  function openDB() {

    return new Promise(
      function(resolve, reject) {

        const request =
          indexedDB.open(
            "PlaysafePWA",
            1
          );


        request.onupgradeneeded =
          function(event) {

            const database =
              event.target.result;


            if (
              !database.objectStoreNames.contains(
                "objects"
              )
            ) {

              database.createObjectStore(
                "objects",
                {
                  keyPath: "nr"
                }
              );
            }


            if (
              !database.objectStoreNames.contains(
                "meta"
              )
            ) {

              database.createObjectStore(
                "meta",
                {
                  keyPath: "key"
                }
              );
            }
          };


        request.onsuccess =
          function() {

            db =
              request.result;

            resolve();
          };


        request.onerror =
          function() {

            reject(
              request.error
            );
          };
      }
    );
  }


  function dbGetObjects() {

    return new Promise(
      function(resolve, reject) {

        const transaction =
          db.transaction(
            "objects",
            "readonly"
          );

        const store =
          transaction.objectStore(
            "objects"
          );

        const request =
          store.getAll();


        request.onsuccess =
          function() {

            resolve(
              request.result || []
            );
          };


        request.onerror =
          function() {

            reject(
              request.error
            );
          };
      }
    );
  }


  function dbReplaceObjects(data) {

    return new Promise(
      function(resolve, reject) {

        const transaction =
          db.transaction(
            "objects",
            "readwrite"
          );

        const store =
          transaction.objectStore(
            "objects"
          );


        store.clear();


        data.forEach(
          function(item) {

            if (
              item.nr !== undefined &&
              item.nr !== null &&
              item.nr !== ""
            ) {

              store.put(
                item
              );
            }
          }
        );


        transaction.oncomplete =
          function() {

            resolve();
          };


        transaction.onerror =
          function() {

            reject(
              transaction.error
            );
          };
      }
    );
  }


  function dbSetMeta(
    key,
    value
  ) {

    return new Promise(
      function(resolve, reject) {

        const transaction =
          db.transaction(
            "meta",
            "readwrite"
          );

        const store =
          transaction.objectStore(
            "meta"
          );

        const request =
          store.put(
            {
              key: key,
              value: value
            }
          );


        request.onsuccess =
          function() {

            resolve();
          };


        request.onerror =
          function() {

            reject(
              request.error
            );
          };
      }
    );
  }


  function dbGetMeta(key) {

    return new Promise(
      function(resolve, reject) {

        const transaction =
          db.transaction(
            "meta",
            "readonly"
          );

        const store =
          transaction.objectStore(
            "meta"
          );

        const request =
          store.get(
            key
          );


        request.onsuccess =
          function() {

            resolve(
              request.result
                ? request.result.value
                : null
            );
          };


        request.onerror =
          function() {

            reject(
              request.error
            );
          };
      }
    );
  }


  // =====================================================
  // GOOGLE IDENTITY SERVICES
  // =====================================================

  function initGoogleAuth() {

    if (
      !window.google ||
      !google.accounts ||
      !google.accounts.oauth2
    ) {

      gisReady = false;

      return false;
    }


    tokenClient =
      google.accounts.oauth2.initTokenClient(
        {

          client_id:
            CLIENT_ID,

          scope:
            SCOPES,

          callback:
            function() {}

        }
      );


    gisReady = true;

    return true;
  }


  function waitForGoogle() {

    return new Promise(
      function(resolve) {

        let attempts = 0;

        const timer =
          setInterval(
            function() {

              attempts++;


              if (
                initGoogleAuth()
              ) {

                clearInterval(
                  timer
                );

                resolve(
                  true
                );

                return;
              }


              if (
                attempts >= 30
              ) {

                clearInterval(
                  timer
                );

                resolve(
                  false
                );
              }

            },
            200
          );
      }
    );
  }


  function requestGoogleToken() {

    return new Promise(
      function(resolve, reject) {

        if (
          !navigator.onLine
        ) {

          reject(
            new Error(
              "Internetiühendus puudub."
            )
          );

          return;
        }


        if (
          !gisReady ||
          !tokenClient
        ) {

          reject(
            new Error(
              "Google'i sisselogimisteenus ei ole veel valmis."
            )
          );

          return;
        }


        tokenClient.callback =
          function(response) {

            if (
              response.error
            ) {

              reject(
                new Error(
                  response.error_description ||
                  response.error
                )
              );

              return;
            }


            accessToken =
              response.access_token;


            authBox.style.display =
              "none";


            resolve(
              accessToken
            );
          };


        tokenClient.requestAccessToken(
          {
            prompt:
              accessToken
                ? ""
                : "consent"
          }
        );
      }
    );
  }


  // =====================================================
  // APPS SCRIPT API
  // =====================================================

  async function runAppsScript(
    functionName,
    parameters
  ) {

    if (
      !accessToken
    ) {

      throw new Error(
        "Google'i autoriseerimine on vajalik."
      );
    }


    const body = {

      function:
        functionName

    };


    if (
      parameters &&
      parameters.length
    ) {

      body.parameters =
        parameters;
    }


    const response =
      await fetch(
        "https://script.googleapis.com/v1/scripts/" +
        encodeURIComponent(
          SCRIPT_ID
        ) +
        ":run",
        {

          method:
            "POST",

          headers: {

            "Authorization":
              "Bearer " +
              accessToken,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              body
            )

        }
      );


    let data;


    try {

      data =
        await response.json();

    }
    catch (error) {

      throw new Error(
        "Google API vastus ei olnud loetav."
      );
    }


    if (
      response.status === 401
    ) {

      accessToken = null;

      throw new Error(
        "Google'i sisselogimine aegus. Vajuta uuesti Sünkroniseeri."
      );
    }


    if (
      !response.ok
    ) {

      const message =
        data &&
        data.error &&
        data.error.message
          ? data.error.message
          : "Google API viga " +
            response.status;

      throw new Error(
        message
      );
    }


    if (
      data.error
    ) {

      let message =
        "Apps Scripti käivitamine ebaõnnestus.";


      if (
        data.error.details &&
        data.error.details.length
      ) {

        const detail =
          data.error.details[0];

        if (
          detail.errorMessage
        ) {

          message =
            detail.errorMessage;
        }
      }


      throw new Error(
        message
      );
    }


    if (
      !data.response
    ) {

      throw new Error(
        "Apps Script ei tagastanud vastust."
      );
    }


    return data.response.result;
  }


  // =====================================================
  // SÜNKRONISEERIMINE
  // =====================================================

  async function synchronize() {

    if (
      syncInProgress
    ) {
      return;
    }


    hideError();


    if (
      !navigator.onLine
    ) {

      toast(
        "Offline — kasutan telefoni salvestatud registrit."
      );

      updateConnection();

      return;
    }


    syncInProgress = true;

    syncButton.disabled =
      true;

    syncButton.textContent =
      "Sünkroniseerin...";


    try {

      if (
        !accessToken
      ) {

        await requestGoogleToken();
      }


      const result =
        await runAppsScript(
          "getObjektid",
          []
        );


      if (
        !Array.isArray(
          result
        )
      ) {

        throw new Error(
          "getObjektid() ei tagastanud objektide nimekirja."
        );
      }


      await dbReplaceObjects(
        result
      );


      const now =
        new Date().toISOString();


      await dbSetMeta(
        "lastSync",
        now
      );


      objektid =
        result;


      renderObjects();

      await updateSyncInfo();


      authBox.style.display =
        "none";


      toast(
        "Sünkroniseeritud — " +
        objektid.length +
        " objekti"
      );

    }
    catch (error) {

      console.error(
        error
      );


      showError(
        "Sünkroniseerimise viga: " +
        (
          error &&
          error.message
            ? error.message
            : String(error)
        )
      );


      if (
        !accessToken
      ) {

        authBox.style.display =
          "block";
      }


      toast(
        "Sünkroniseerimine ebaõnnestus"
      );

    }
    finally {

      syncInProgress =
        false;

      syncButton.disabled =
        false;

      syncButton.textContent =
        "↻ Sünkroniseeri";

      updateConnection();
    }
  }


  // =====================================================
  // OBJEKTIDE KUVAMINE
  // =====================================================

  function getValue(
    object,
    possibleKeys
  ) {

    for (
      const key of possibleKeys
    ) {

      if (
        object[key] !== undefined &&
        object[key] !== null &&
        object[key] !== ""
      ) {

        return object[key];
      }
    }

    return "";
  }


  function getObjectName(object) {

    return getValue(
      object,
      [
        "objekt",
        "nimi",
        "Objekt",
        "Nimi"
      ]
    );
  }


  function getObjectAddress(object) {

    return getValue(
      object,
      [
        "aadress",
        "Aadress"
      ]
    );
  }


  function escapeHtml(value) {

    return String(
      value === undefined ||
      value === null
        ? ""
        : value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function renderObjects() {

    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    const filtered =
      objektid.filter(
        function(object) {

          const text = [

            object.nr,

            getObjectName(
              object
            ),

            getObjectAddress(
              object
            ),

            getValue(
              object,
              [
                "tellija",
                "Tellija"
              ]
            )

          ]
            .join(
              " "
            )
            .toLowerCase();


          return text.includes(
            query
          );
        }
      );


    objectList.innerHTML =
      "";


    if (
      filtered.length === 0
    ) {

      objectList.innerHTML =
        '<div class="empty">' +
        (
          objektid.length === 0
            ? "Objekte ei ole veel telefoni sünkroniseeritud."
            : "Otsingule vastavaid objekte ei leitud."
        ) +
        "</div>";

      return;
    }


    filtered.forEach(
      function(object) {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "object-card";


        card.innerHTML =

          '<div class="object-number">' +
          "NR " +
          escapeHtml(
            object.nr
          ) +
          "</div>" +

          '<div class="object-name">' +
          escapeHtml(
            getObjectName(
              object
            ) ||
            "Nimetu objekt"
          ) +
          "</div>" +

          '<div class="object-address">' +
          escapeHtml(
            getObjectAddress(
              object
            )
          ) +
          "</div>";


        card.addEventListener(
          "click",
          function() {

            showObject(
              object
            );
          }
        );


        objectList.appendChild(
          card
        );
      }
    );
  }


  function detailRow(
    label,
    value
  ) {

    if (
      value === undefined ||
      value === null ||
      value === ""
    ) {

      return "";
    }


    return (

      '<div class="detail-row">' +

        '<div class="detail-label">' +
          escapeHtml(
            label
          ) +
        "</div>" +

        '<div class="detail-value">' +
          escapeHtml(
            value
          ) +
        "</div>" +

      "</div>"

    );
  }


  function showObject(object) {

    listView.style.display =
      "none";

    detailView.style.display =
      "block";

    pageTitle.textContent =
      "Objekt";


    const name =
      getObjectName(
        object
      ) ||
      "Nimetu objekt";


    detailView.innerHTML =

      '<button class="back-button" id="backButton">' +
        "‹ Tagasi objektidesse" +
      "</button>" +

      '<div class="detail-card">' +

        '<div class="detail-title">' +
          escapeHtml(
            name
          ) +
        "</div>" +

        detailRow(
          "Jrk nr",
          object.nr
        ) +

        detailRow(
          "Aadress",
          getObjectAddress(
            object
          )
        ) +

        detailRow(
          "Väljaku tüüp",
          getValue(
            object,
            [
              "valjakuTyyp",
              "väljakuTyyp",
              "valjaku_tyyp",
              "Väljaku tüüp"
            ]
          )
        ) +

        detailRow(
          "Hindamise liik",
          getValue(
            object,
            [
              "hindamiseLiik",
              "hindamine",
              "Hindamise liik"
            ]
          )
        ) +

        detailRow(
          "Tellija",
          getValue(
            object,
            [
              "tellija",
              "Tellija"
            ]
          )
        ) +

        detailRow(
          "Staatus",
          getValue(
            object,
            [
              "staatus",
              "Staatus"
            ]
          )
        ) +

        detailRow(
          "Aruande nr",
          getValue(
            object,
            [
              "aruandeNr",
              "aruande_nr",
              "Aruande nr"
            ]
          )
        ) +

        '<button class="start-button" id="startButton">' +
          "Alusta pildistamist" +
        "</button>" +

      "</div>";


    document
      .getElementById(
        "backButton"
      )
      .addEventListener(
        "click",
        showList
      );


    document
      .getElementById(
        "startButton"
      )
      .addEventListener(
        "click",
        function() {

          toast(
            "Google API ühendus on valmis. Elemendid ja fotod lisame järgmises etapis."
          );
        }
      );
  }


  function showList() {

    detailView.style.display =
      "none";

    listView.style.display =
      "block";

    pageTitle.textContent =
      "Objektid";
  }


  // =====================================================
  // ÜHENDUS / INFO
  // =====================================================

  function updateConnection() {

    if (
      navigator.onLine
    ) {

      connectionStatus.textContent =
        "✓ Ühendus olemas";

      connectionStatus.className =
        "connection online";

    }
    else {

      connectionStatus.textContent =
        "● Offline";

      connectionStatus.className =
        "connection offline";
    }
  }


  async function updateSyncInfo() {

    const lastSync =
      await dbGetMeta(
        "lastSync"
      );


    if (
      !lastSync
    ) {

      syncInfo.textContent =
        "Seda telefoni pole veel registriga sünkroniseeritud.";

      return;
    }


    const date =
      new Date(
        lastSync
      );


    syncInfo.textContent =
      "Telefonis " +
      objektid.length +
      " objekti • viimati sünkroniseeritud " +
      date.toLocaleString(
        "et-EE"
      );
  }


  function showError(message) {

    errorBox.textContent =
      message;

    errorBox.style.display =
      "block";
  }


  function hideError() {

    errorBox.style.display =
      "none";

    errorBox.textContent =
      "";
  }


  function toast(message) {

    const element =
      document.getElementById(
        "toast"
      );


    element.textContent =
      message;

    element.style.display =
      "block";


    clearTimeout(
      toast.timer
    );


    toast.timer =
      setTimeout(
        function() {

          element.style.display =
            "none";

        },
        3000
      );
  }


  // =====================================================
  // EVENTID
  // =====================================================

  searchInput.addEventListener(
    "input",
    renderObjects
  );


  syncButton.addEventListener(
    "click",
    synchronize
  );


  googleButton.addEventListener(
    "click",
    async function() {

      hideError();


      try {

        await requestGoogleToken();

        await synchronize();

      }
      catch (error) {

        showError(
          "Google'i ühenduse viga: " +
          (
            error.message ||
            String(error)
          )
        );
      }
    }
  );


  window.addEventListener(
    "online",
    function() {

      updateConnection();

      toast(
        "Internetiühendus taastatud"
      );
    }
  );


  window.addEventListener(
    "offline",
    function() {

      updateConnection();

      toast(
        "Offline — andmed jäävad telefoni"
      );
    }
  );


  // =====================================================
  // SERVICE WORKER
  // =====================================================

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      function() {

        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .then(
            function(registration) {

              registration.update();
            }
          )
          .catch(
            function(error) {

              console.error(
                "Service Worker:",
                error
              );
            }
          );
      }
    );
  }


  // =====================================================
  // KÄIVITAMINE
  // =====================================================

  async function startApp() {

    try {

      await openDB();


      objektid =
        await dbGetObjects();


      renderObjects();

      await updateSyncInfo();

      updateConnection();


      const googleLoaded =
        await waitForGoogle();


      if (
        navigator.onLine &&
        !googleLoaded
      ) {

        showError(
          "Google'i sisselogimisteenust ei õnnestunud laadida."
        );

        authBox.style.display =
          "block";

        return;
      }


      if (
        navigator.onLine
      ) {

        authBox.style.display =
          "block";
      }

    }
    catch (error) {

      showError(
        "Rakenduse käivitamise viga: " +
        (
          error.message ||
          String(error)
        )
      );
    }
  }


  startApp();

</script>

</body>
</html>
