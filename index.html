<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d1d1f">
  <title>Playsafe</title>

  <link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Playsafe">
  
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 50px 20px;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 700;
      color: #777;
    }

    h1 {
      font-size: 32px;
      margin: 6px 0 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
    }

    .status {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .text {
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">PLAYSAFE</div>

    <h1>Välitöö</h1>

    <div class="card">

      <div class="status">
        ✓ PWA test töötab
      </div>

      <div class="text">
        Kui näed seda lehte, töötab Playsafe'i uus veebirakendus GitHub Pagesis.
      </div>

    </div>

  </div>

</body>
</html>
